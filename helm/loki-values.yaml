# Configuration du chart grafana/loki (stockage des logs)
# Installé par setup.ps1 avec :
#   helm upgrade --install loki grafana/loki -n monitoring -f helm/loki-values.yaml
#
# Les logs sont rangés dans Garage (stockage objet compatible S3, voir k8s/garage.yaml).

# Un seul pod Loki qui fait tout (lecture, écriture) : le plus simple pour un cluster de test.
deploymentMode: SingleBinary

loki:
  auth_enabled: false            # pas de mot de passe ni de « tenant » : un seul utilisateur
  commonConfig:
    replication_factor: 1        # une seule copie des données
  storage:
    type: s3                     # stockage objet, ici fourni par Garage
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: garage.monitoring.svc.cluster.local:3900
      region: garage
      # Les clés viennent du Secret « garage-credentials » (variables d'environnement),
      # elles ne sont donc jamais écrites dans ce fichier ni dans Git.
      accessKeyId: ${GARAGE_DEFAULT_ACCESS_KEY}
      secretAccessKey: ${GARAGE_DEFAULT_SECRET_KEY}
      s3ForcePathStyle: true     # adresse du type http://garage:3900/loki (style « chemin »)
      insecure: true             # HTTP sans TLS, à l'intérieur du cluster
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  # Permet d'utiliser ${...} dans la configuration, remplacé par les variables d'environnement.
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: garage-credentials
  persistence:
    enabled: true
    size: 2Gi                    # disque local pour l'index et le cache ; les logs vont dans Garage

# Les autres modes de déploiement sont désactivés.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Composants optionnels désactivés pour économiser de la mémoire :
chunksCache:
  enabled: false                 # cache (memcached)
resultsCache:
  enabled: false                 # cache (memcached)
gateway:
  enabled: false                 # proxy devant Loki : inutile, on parle directement au service « loki »
lokiCanary:
  enabled: false                 # petit programme de test qui écrit des logs en continu
test:
  enabled: false                 # test Helm qui dépend du canary
minio:
  enabled: false                 # pas de MinIO : on utilise Garage
