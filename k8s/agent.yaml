# L'agent (FastAPI) dans le cluster, namespace « monitoring ».
#
# Créés par setup.ps1 / setup.sh avant ce fichier (jamais dans Git) :
#   - ConfigMap « agent-settings »  : LLM_PROVIDER, AWS_REGION, BEDROCK_MODEL_ID, OLLAMA_URL
#   - Secret    « agent-api-key »   : AGENT_API_KEY (la clé qu'Open WebUI utilise)
#   - Secret    « aws-credentials » : facultatif, clés AWS pour Bedrock
#     (inutile sur EC2 : la machine a un rôle IAM)
#
#   kubectl apply -f k8s/agent.yaml

# --- Droits : l'agent peut LIRE le cluster, jamais le modifier -------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-agent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-agent-read-only
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, nodes, namespaces, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-agent-read-only
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-agent-read-only
subjects:
  - kind: ServiceAccount
    name: k8s-agent
    namespace: monitoring
---
# --- L'agent ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-agent
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: k8s-agent }
  template:
    metadata:
      labels: { app: k8s-agent }
    spec:
      serviceAccountName: k8s-agent
      containers:
        - name: agent
          image: k8s-agent:local      # remplacé par setup.ps1 / setup.sh par le nom unique de l'image
          imagePullPolicy: Never      # image construite dans minikube, pas téléchargée
          ports:
            - { name: http, containerPort: 8001 }
          envFrom:
            - configMapRef: { name: agent-settings }
            - secretRef: { name: agent-api-key }
            - secretRef: { name: aws-credentials, optional: true }
          env:
            # Si les clés AWS ont été données sous forme de fichier (« aws configure »)
            - { name: AWS_SHARED_CREDENTIALS_FILE, value: /aws/credentials }
          volumeMounts:
            - { name: aws, mountPath: /aws, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 3
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 512Mi }
      volumes:
        - name: aws
          secret: { secretName: aws-credentials, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-agent
  namespace: monitoring
spec:
  selector: { app: k8s-agent }
  ports:
    - { name: http, port: 8001, targetPort: 8001 }
